name: Build Jarvis APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Write Jarvis project
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral(); maven { url = uri("https://alphacephei.com/maven/") } } }
          rootProject.name = "Jarvis"
          include(":app")
          EOF
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.me.jarvis"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.me.jarvis"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("net.java.dev.jna:jna:5.13.0@aar")
              implementation("com.alphacephei:vosk-android:0.3.47@aar")
              implementation("com.google.mediapipe:tasks-genai:0.10.24")
          }
          EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <queries>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
                  <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent>
              </queries>
              <application android:label="Jarvis" android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <uses-native-library android:name="libOpenCL.so" android:required="false"/>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".JarvisService" android:exported="false"
                      android:foregroundServiceType="microphone"/>
                  <service android:name=".JarvisAccess" android:exported="true" android:label="Jarvis"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/jarvis_access"/>
                  </service>
              </application>
          </manifest>
          EOF
          mkdir -p $(dirname app/src/main/res/xml/jarvis_access.xml)
          cat > app/src/main/res/xml/jarvis_access.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:description="@string/access_desc"
              android:notificationTimeout="100"/>
          EOF
          mkdir -p $(dirname app/src/main/res/values/strings.xml)
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="access_desc">Lets Jarvis read the screen and tap, type and scroll for you.</string>
          </resources>
          EOF
          mkdir -p $(dirname app/src/main/java/com/me/jarvis/JarvisAccess.kt)
          cat > app/src/main/java/com/me/jarvis/JarvisAccess.kt <<'EOF'
          package com.me.jarvis

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.os.Bundle
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class JarvisAccess : AccessibilityService() {
              companion object { var inst: JarvisAccess? = null }

              override fun onServiceConnected() { inst = this }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onUnbind(i: Intent?): Boolean { inst = null; return super.onUnbind(i) }

              private fun find(pred: (AccessibilityNodeInfo) -> Boolean): AccessibilityNodeInfo? {
                  fun walk(n: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                      if (n == null) return null
                      if (pred(n)) return n
                      for (i in 0 until n.childCount) walk(n.getChild(i))?.let { return it }
                      return null
                  }
                  return walk(rootInActiveWindow)
              }

              fun hasEditable() = find { it.isEditable } != null

              fun screenText(): String {
                  val sb = StringBuilder()
                  fun walk(n: AccessibilityNodeInfo?) {
                      if (n == null) return
                      n.text?.let { sb.append(it).append(". ") }
                      n.contentDescription?.let { sb.append(it).append(". ") }
                      for (i in 0 until n.childCount) walk(n.getChild(i))
                  }
                  walk(rootInActiveWindow)
                  return sb.toString()
              }

              fun tap(label: String): Boolean {
                  val want = label.trim().lowercase()
                  val n = find { (it.text ?: it.contentDescription)?.toString()?.lowercase()?.contains(want) == true } ?: return false
                  var c: AccessibilityNodeInfo? = n
                  while (c != null && !c.isClickable) c = c.parent
                  return (c ?: n).performAction(AccessibilityNodeInfo.ACTION_CLICK)
              }

              fun type(text: String): Boolean {
                  val n = find { it.isEditable && it.isFocused } ?: find { it.isEditable } ?: return false
                  n.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  val b = Bundle()
                  b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                  return n.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b)
              }

              fun enter(): Boolean {
                  val n = find { it.isEditable && it.isFocused } ?: find { it.isEditable } ?: return false
                  return n.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
              }

              fun global(n: Int) = performGlobalAction(n)

              fun swipe(dir: String): Boolean {
                  val d = resources.displayMetrics
                  val w = d.widthPixels.toFloat()
                  val h = d.heightPixels.toFloat()
                  val p = Path()
                  when (dir) {
                      "down" -> { p.moveTo(w / 2, h * 0.7f); p.lineTo(w / 2, h * 0.3f) }
                      "up" -> { p.moveTo(w / 2, h * 0.3f); p.lineTo(w / 2, h * 0.7f) }
                      "left" -> { p.moveTo(w * 0.8f, h / 2); p.lineTo(w * 0.2f, h / 2) }
                      else -> { p.moveTo(w * 0.2f, h / 2); p.lineTo(w * 0.8f, h / 2) }
                  }
                  return dispatchGesture(
                      GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, 300)).build(), null, null
                  )
              }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/me/jarvis/JarvisService.kt)
          cat > app/src/main/java/com/me/jarvis/JarvisService.kt <<'EOF'
          package com.me.jarvis

          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.*
          import android.speech.*
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import com.google.mediapipe.tasks.genai.llminference.LlmInference
          import kotlinx.coroutines.flow.MutableStateFlow
          import java.io.File
          import java.util.Locale
          import android.content.ContentUris
          import android.media.MediaPlayer
          import android.net.Uri
          import android.provider.MediaStore
          import org.vosk.Model
          import org.vosk.Recognizer
          import org.vosk.android.SpeechService

          object JarvisState {
              val status = MutableStateFlow("OFFLINE")
              val reply = MutableStateFlow("Tap ACTIVATE, then say \"Jarvis\".")
          }

          class JarvisService : Service() {
              private val main = Handler(Looper.getMainLooper())
              private var vosk: SpeechService? = null
              private var busy = false
              private var player: MediaPlayer? = null

              // Offline wake-word listener (no account or key needed)
              private val voskListener = object : org.vosk.android.RecognitionListener {
                  override fun onPartialResult(h: String?) { if (h?.contains("jarvis") == true) onWake() }
                  override fun onResult(h: String?) { if (h?.contains("jarvis") == true) onWake() }
                  override fun onFinalResult(h: String?) {}
                  override fun onError(e: Exception?) {}
                  override fun onTimeout() {}
              }

              private fun copyAssets(src: String, dest: File) {
                  val kids = assets.list(src) ?: return
                  if (kids.isEmpty()) {
                      dest.parentFile?.mkdirs()
                      assets.open(src).use { i -> dest.outputStream().use { o -> i.copyTo(o) } }
                  } else {
                      dest.mkdirs()
                      kids.forEach { copyAssets("$src/$it", File(dest, it)) }
                  }
              }
              private var llm: LlmInference? = null
              private lateinit var tts: TextToSpeech
              private lateinit var stt: SpeechRecognizer

              override fun onBind(i: Intent?): IBinder? = null
              override fun onStartCommand(i: Intent?, f: Int, id: Int) = START_STICKY

              override fun onCreate() {
                  super.onCreate()
                  getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(NotificationChannel("j", "Jarvis", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "j").setContentTitle("Jarvis is listening")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now).build()
                  startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)

                  tts = TextToSpeech(this) { tts.language = Locale.US }
                  tts.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) {}
                      override fun onDone(id: String?) { main.post { standby() } }
                      @Deprecated("Deprecated in Java")
                      override fun onError(id: String?) { main.post { standby() } }
                  })

                  stt = SpeechRecognizer.createSpeechRecognizer(this)
                  stt.setRecognitionListener(object : RecognitionListener {
                      override fun onResults(b: Bundle?) {
                          val q = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                          if (q == null) standby() else think(q)
                      }
                      override fun onError(e: Int) { standby() }
                      override fun onReadyForSpeech(p: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(b: Bundle?) {}
                      override fun onEvent(t: Int, b: Bundle?) {}
                  })

                  Thread {
                      val f = File(filesDir, "model.task")
                      try {
                          if (f.exists()) llm = LlmInference.createFromOptions(
                              this, LlmInference.LlmInferenceOptions.builder()
                                  .setModelPath(f.path).setMaxTokens(1024).build()
                          )
                      } catch (e: Exception) { JarvisState.reply.value = "Model error: " + e.message }
                  }.start()

                  JarvisState.status.value = "LOADING"
                  JarvisState.reply.value = "Preparing wake word. First start takes a minute..."
                  Thread {
                      try {
                          val dir = File(filesDir, "vosk")
                          val ok = File(dir, "ok")
                          if (!ok.exists()) {
                              copyAssets("model-en-us", File(dir, "model-en-us"))
                              ok.writeText("1")
                          }
                          val rec = Recognizer(Model(File(dir, "model-en-us").path), 16000f, "[\"jarvis\", \"[unk]\"]")
                          val ss = SpeechService(rec, 16000f)
                          main.post {
                              vosk = ss
                              JarvisState.reply.value = "Say \"Jarvis\"."
                              standby()
                          }
                      } catch (e: Exception) {
                          JarvisState.reply.value = "Wake word error: " + e.message
                      }
                  }.start()
              }

              private fun onWake() {
                  if (busy) return
                  busy = true
                  main.post {
                      vosk?.stop()
                      JarvisState.status.value = "LISTENING"
                      main.postDelayed({
                          stt.startListening(
                              Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                                  .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          )
                      }, 300)
                  }
              }

              private fun think(q: String) {
                  JarvisState.status.value = "THINKING"
                  val cmd = try { command(q) } catch (e: Exception) { "Sorry, that failed: " + e.message }
                  if (cmd != null) { say(cmd); return }
                  var ask = q
                  if (Regex("screen").containsMatchIn(q.lowercase()) && Regex("read|summari|describe|what").containsMatchIn(q.lowercase())) {
                      val t = JarvisAccess.inst?.screenText() ?: return say("Please switch on Jarvis under Accessibility first, sir.")
                      ask = "This is the text on my phone screen: " + t.take(1200) + " My request: " + q
                  }
                  Thread {
                      val a = try {
                          llm?.generateResponse(
                              "<start_of_turn>user\nYou are JARVIS, a witty, concise AI butler. " +
                                  "Answer in at most three sentences. " + ask +
                                  "<end_of_turn>\n<start_of_turn>model\n"
                          ) ?: "The language model is not installed yet, sir."
                      } catch (e: Exception) { "Something went wrong: " + e.message }
                      main.post { say(a) }
                  }.start()
              }

              private fun say(a: String) {
                  JarvisState.reply.value = a
                  JarvisState.status.value = "SPEAKING"
                  tts.speak(a, TextToSpeech.QUEUE_FLUSH, null, "u")
              }

              // Routes voice commands: music controls, play, file search, open app
              private fun command(q: String): String? {
                  val l = q.trim().lowercase()
                  if (Regex("^(pause|stop|resume|continue)( the)?( music| playing| song)?$").matches(l)) {
                      val p = player ?: return "Nothing is playing, sir."
                      if (l.startsWith("resume") || l.startsWith("continue")) p.start()
                      else if (l.startsWith("pause")) p.pause()
                      else { p.release(); player = null }
                      return "Done, sir."
                  }
                  searchInApp(q)?.let { return it }
                  Regex("^play\\s+(.+)$").
