name: Build Jarvis APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Write Jarvis project
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral(); maven { url = uri("https://alphacephei.com/maven/") } } }
          rootProject.name = "Jarvis"
          include(":app")
          EOF
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.me.jarvis"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.me.jarvis"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("net.java.dev.jna:jna:5.13.0@aar")
              implementation("com.alphacephei:vosk-android:0.3.47@aar")
              implementation("com.google.mediapipe:tasks-genai:0.10.24")
          }
          EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries>
              <application android:label="Jarvis" android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <uses-native-library android:name="libOpenCL.so" android:required="false"/>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".JarvisService" android:exported="false"
                      android:foregroundServiceType="microphone"/>
              </application>
          </manifest>
          EOF
          mkdir -p $(dirname app/src/main/java/com/me/jarvis/JarvisService.kt)
          cat > app/src/main/java/com/me/jarvis/JarvisService.kt <<'EOF'
          package com.me.jarvis

          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.*
          import android.speech.*
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import com.google.mediapipe.tasks.genai.llminference.LlmInference
          import kotlinx.coroutines.flow.MutableStateFlow
          import java.io.File
          import java.util.Locale
          import org.vosk.Model
          import org.vosk.Recognizer
          import org.vosk.android.SpeechService

          object JarvisState {
              val status = MutableStateFlow("OFFLINE")
              val reply = MutableStateFlow("Tap ACTIVATE, then say \"Jarvis\".")
          }

          class JarvisService : Service() {
              private val main = Handler(Looper.getMainLooper())
              private var vosk: SpeechService? = null
              private var busy = false

              // Offline wake-word listener (no account or key needed)
              private val voskListener = object : org.vosk.android.RecognitionListener {
                  override fun onPartialResult(h: String?) { if (h?.contains("jarvis") == true) onWake() }
                  override fun onResult(h: String?) { if (h?.contains("jarvis") == true) onWake() }
                  override fun onFinalResult(h: String?) {}
                  override fun onError(e: Exception?) {}
                  override fun onTimeout() {}
              }

              private fun copyAssets(src: String, dest: File) {
                  val kids = assets.list(src) ?: return
                  if (kids.isEmpty()) {
                      dest.parentFile?.mkdirs()
                      assets.open(src).use { i -> dest.outputStream().use { o -> i.copyTo(o) } }
                  } else {
                      dest.mkdirs()
                      kids.forEach { copyAssets("$src/$it", File(dest, it)) }
                  }
              }
              private var llm: LlmInference? = null
              private lateinit var tts: TextToSpeech
              private lateinit var stt: SpeechRecognizer

              override fun onBind(i: Intent?): IBinder? = null
              override fun onStartCommand(i: Intent?, f: Int, id: Int) = START_STICKY

              override fun onCreate() {
                  super.onCreate()
                  getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(NotificationChannel("j", "Jarvis", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "j").setContentTitle("Jarvis is listening")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now).build()
                  startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)

                  tts = TextToSpeech(this) { tts.language = Locale.US }
                  tts.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) {}
                      override fun onDone(id: String?) { main.post { standby() } }
                      @Deprecated("Deprecated in Java")
                      override fun onError(id: String?) { main.post { standby() } }
                  })

                  stt = SpeechRecognizer.createSpeechRecognizer(this)
                  stt.setRecognitionListener(object : RecognitionListener {
                      override fun onResults(b: Bundle?) {
                          val q = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                          if (q == null) standby() else think(q)
                      }
                      override fun onError(e: Int) { standby() }
                      override fun onReadyForSpeech(p: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(b: Bundle?) {}
                      override fun onEvent(t: Int, b: Bundle?) {}
                  })

                  Thread {
                      val f = File(filesDir, "model.task")
                      try {
                          if (f.exists()) llm = LlmInference.createFromOptions(
                              this, LlmInference.LlmInferenceOptions.builder()
                                  .setModelPath(f.path).setMaxTokens(512).build()
                          )
                      } catch (e: Exception) { JarvisState.reply.value = "Model error: " + e.message }
                  }.start()

                  JarvisState.status.value = "LOADING"
                  JarvisState.reply.value = "Preparing wake word. First start takes a minute..."
                  Thread {
                      try {
                          val dir = File(filesDir, "vosk")
                          val ok = File(dir, "ok")
                          if (!ok.exists()) {
                              copyAssets("model-en-us", File(dir, "model-en-us"))
                              ok.writeText("1")
                          }
                          val rec = Recognizer(Model(File(dir, "model-en-us").path), 16000f, "[\"jarvis\", \"[unk]\"]")
                          val ss = SpeechService(rec, 16000f)
                          main.post {
                              vosk = ss
                              JarvisState.reply.value = "Say \"Jarvis\"."
                              standby()
                          }
                      } catch (e: Exception) {
                          JarvisState.reply.value = "Wake word error: " + e.message
                      }
                  }.start()
              }

              private fun onWake() {
                  if (busy) return
                  busy = true
                  main.post {
                      vosk?.stop()
                      JarvisState.status.value = "LISTENING"
                      main.postDelayed({
                          stt.startListening(
                              Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                                  .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          )
                      }, 300)
                  }
              }

              private fun think(q: String) {
                  JarvisState.status.value = "THINKING"
                  Thread {
                      val a = try {
                          llm?.generateResponse(
                              "<start_of_turn>user\nYou are JARVIS, a witty, concise AI butler. " +
                                  "Answer in at most three sentences. " + q +
                                  "<end_of_turn>\n<start_of_turn>model\n"
                          ) ?: "The language model is not installed yet, sir."
                      } catch (e: Exception) { "Something went wrong: " + e.message }
                      main.post {
                          JarvisState.reply.value = a
                          JarvisState.status.value = "SPEAKING"
                          tts.speak(a, TextToSpeech.QUEUE_FLUSH, null, "u")
                      }
                  }.start()
              }

              private fun standby() {
                  JarvisState.status.value = "STANDBY"
                  busy = false
                  vosk?.startListening(voskListener)
              }

              override fun onDestroy() {
                  vosk?.shutdown(); stt.destroy(); tts.shutdown(); llm?.close()
                  JarvisState.status.value = "OFFLINE"
                  super.onDestroy()
              }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/me/jarvis/MainActivity.kt)
          cat > app/src/main/java/com/me/jarvis/MainActivity.kt <<'EOF'
          package com.me.jarvis

          import android.Manifest
          import android.content.Intent
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.PathEffect
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.drawscope.rotate
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.io.File

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          val status by JarvisState.status.collectAsState()
                          val reply by JarvisState.reply.collectAsState()

                          val pick = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                              uri?.let {
                                  JarvisState.reply.value = "Importing model..."
                                  Thread {
                                      contentResolver.openInputStream(it)?.use { i ->
                                          File(filesDir, "model.task").outputStream().use { o -> i.copyTo(o) }
                                      }
                                      JarvisState.reply.value = "Model imported. Tap ACTIVATE."
                                  }.start()
                              }
                          }
                          val perms = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                              if (it[Manifest.permission.RECORD_AUDIO] == true)
                                  startForegroundService(Intent(this@MainActivity, JarvisService::class.java))
                          }

                          Column(
                              Modifier.fillMaxSize().background(Color(0xFF02060D)).padding(24.dp).systemBarsPadding(),
                              Arrangement.SpaceBetween, Alignment.CenterHorizontally
                          ) {
                              Text("J.A.R.V.I.S.", color = Color(0xFF00E5FF), fontSize = 22.sp,
                                  fontFamily = FontFamily.Monospace, letterSpacing = 8.sp)
                              Hud(status)
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text(status, color = Color(0xFF00E5FF), fontSize = 16.sp,
                                      fontFamily = FontFamily.Monospace, letterSpacing = 4.sp)
                                  Spacer(Modifier.height(12.dp))
                                  Text(reply, color = Color(0xFFCFEFFF), fontSize = 15.sp, textAlign = TextAlign.Center,
                                      modifier = Modifier.heightIn(min = 90.dp))
                              }
                              Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                                  OutlinedButton({ pick.launch(arrayOf("*/*")) }) { Text("Import model") }
                                  Button({
                                      perms.launch(arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.POST_NOTIFICATIONS))
                                  }) { Text("Activate") }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun Hud(status: String) {
              val t = rememberInfiniteTransition(label = "hud")
              val spin by t.animateFloat(0f, 360f, infiniteRepeatable(tween(14000, easing = LinearEasing)), label = "s")
              val pulse by t.animateFloat(0.88f, 1.08f, infiniteRepeatable(tween(1300), RepeatMode.Reverse), label = "p")
              val c = when (status) {
                  "LISTENING" -> Color(0xFFFFC107)
                  "THINKING" -> Color(0xFFFF5252)
                  "SPEAKING" -> Color(0xFF69F0AE)
                  else -> Color(0xFF00E5FF)
              }
              Canvas(Modifier.size(300.dp)) {
                  val r = size.minDimension / 2
                  drawCircle(c.copy(alpha = 0.22f), r * 0.36f * pulse)
                  drawCircle(c, r * 0.30f * pulse, style = Stroke(5f))
                  drawCircle(c.copy(alpha = 0.5f), r * 0.45f, style = Stroke(2f))
                  rotate(spin) {
                      drawCircle(c, r * 0.62f, style = Stroke(4f, pathEffect = PathEffect.dashPathEffect(floatArrayOf(40f, 24f))))
                  }
                  rotate(-spin * 1.6f) {
                      drawCircle(c.copy(alpha = 0.8f), r * 0.80f, style = Stroke(2f, pathEffect = PathEffect.dashPathEffect(floatArrayOf(6f, 14f))))
                  }
                  rotate(spin * 0.5f) {
                      drawCircle(c.copy(alpha = 0.4f), r * 0.97f, style = Stroke(3f, pathEffect = PathEffect.dashPathEffect(floatArrayOf(90f, 50f))))
                  }
              }
          }
          EOF
      - name: Get offline wake-word model
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q m.zip
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
